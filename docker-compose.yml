services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: infcrm
      POSTGRES_PASSWORD: infcrm
      POSTGRES_DB: infcrm_v2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infcrm -d infcrm_v2"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://infcrm:infcrm@postgres:5432/infcrm_v2
      DATABASE_URL_SYNC: postgresql+psycopg2://infcrm:infcrm@postgres:5432/infcrm_v2
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.services.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
