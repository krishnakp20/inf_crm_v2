# Apache vhost for inf.dialdesk.in (Sotrue Influencer CRM — v2)
#
# Install:
#   sudo cp deploy/apache-inf.dialdesk.in.conf /etc/apache2/sites-available/inf.dialdesk.in.conf
#   sudo a2ensite inf.dialdesk.in
#   sudo systemctl reload apache2
#
# Requires these Apache modules (one-time, safe to re-run):
#   sudo a2enmod proxy proxy_http rewrite headers
#   sudo systemctl restart apache2
#
# If this domain already has a certificate from the old deployment, certbot
# will detect it and just rewrite this file's :443 block in place — you
# don't need to run certbot again unless the cert is missing:
#   sudo certbot --apache -d inf.dialdesk.in

<VirtualHost *:80>
    ServerName inf.dialdesk.in

    # Frontend: built static files (npm run build -> dist/), NOT the dev server
    DocumentRoot /var/www/inf-crm-v2/frontend/dist

    <Directory /var/www/inf-crm-v2/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        # Let real files/directories (js, css, images, etc.) serve normally
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        # Everything else is a client-side React Router route -> index.html
        RewriteRule ^ /index.html [L]
    </Directory>

    # Backend API: reverse-proxy to the dockerized FastAPI service
    # (docker-compose.prod.yml binds it to 127.0.0.1:9001, same port the old
    # v1 deployment used — the old stack must be stopped first)
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:9001/api/
    ProxyPassReverse /api/ http://127.0.0.1:9001/api/

    ErrorLog ${APACHE_LOG_DIR}/inf.dialdesk.in-error.log
    CustomLog ${APACHE_LOG_DIR}/inf.dialdesk.in-access.log combined
</VirtualHost>
